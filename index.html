<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>指名手配リスト</title>
    <style>
        body { background: #11141a; color: #fff; font-family: sans-serif; padding: 20px; }
        
        /* 🔲 サイズ変更用の設定（大：1列、中：2列、小：3列） */
        #wanted-list { display: grid; gap: 16px; width: 100%; }
        #wanted-list[data-size="small"] { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
        #wanted-list[data-size="medium"] { grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); }
        #wanted-list[data-size="large"] { grid-template-columns: 1fr; }

        /* 通常カード */
        .wanted-card { background: #171d26; border: 1px solid #252d3d; border-radius: 8px; padding: 16px; }
        .wanted-badge { display: inline-block; padding: 4px 8px; background: #ff3333; color: #fff; font-weight: bold; font-size: 11px; border-radius: 4px; margin-bottom: 10px; }
        .text-area { white-space: pre-wrap; font-weight: bold; font-size: 15px; line-height: 1.6; }

        /* 👑 特殊指名手配（無期限）用の紫デザイン */
        .wanted-card.special-mode { border: 2px solid #b300ff !important; background: linear-gradient(135deg, #1b1124 0%, #11091a 100%) !important; }
        .wanted-card.special-mode .wanted-badge { background: linear-gradient(90deg, #b300ff 0%, #d4af37 100%) !important; }
    </style>
</head>
<body>

    <!-- 🔲 サイズ変更ボタン -->
    <div style="margin-bottom: 15px; display: flex; gap: 8px; align-items: center;">
        <span style="font-size: 14px; color: #a3b3cc;">🔲 カードの大きさ:</span>
        <button onclick="changeSize('small')" style="padding: 6px 12px; background: #252d3d; color: #fff; border: 1px solid #3b485e; cursor: pointer;">小</button>
        <button onclick="changeSize('medium')" style="padding: 6px 12px; background: #252d3d; color: #fff; border: 1px solid #3b485e; cursor: pointer;">中</button>
        <button onclick="changeSize('large')" style="padding: 6px 12px; background: #252d3d; color: #fff; border: 1px solid #3b485e; cursor: pointer;">大</button>
    </div>

    <div id="wanted-list" data-size="medium"></div>

    <script>
        // ⚠️ ここにご自身のスプレッドシートのCSV URLを貼り付けてください
        const SPREADSHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQD3U8h3RprT9JzloMcWAL04QFXRVYH470r00GnBAYkcRiQ33Qha9tws1ozjEHSm1WYPXC2oLxPzYFy/pub?gid=1025771059&single=true&output=csv";

        // サイズ切り替え関数
        function changeSize(size) {
            document.getElementById('wanted-list').setAttribute('data-size', size);
        }

        // CSVをパースする単純な関数
        function parseCSV(text) {
            return text.split('\n').map(row => {
                let fields = []; let field = ''; let inQuotes = false;
                for (let i = 0; i < row.length; i++) {
                    let c = row[i];
                    if (c === '"') { inQuotes = !inQuotes; }
                    else if (c === ',' && !inQuotes) { fields.push(field); field = ''; }
                    else { field += c; }
                }
                fields.push(field); return fields;
            });
        }

        async function fetchList() {
            try {
                const response = await fetch(SPREADSHEET_CSV_URL + "?nocache=" + Date.now());
                const csvText = await response.text();
                const rows = parseCSV(csvText);
                const container = document.getElementById('wanted-list');
                container.innerHTML = '';

                // 2行目（i=1）から順番に処理
                for (let i = 1; i < rows.length; i++) {
                    const row = rows[i];
                    if (!row || row.length < 2) continue;

                    const text = row[1]; // B列：コピペ本文
                    const status = row[2] ? row[2].trim().toUpperCase() : ""; // C列：チェックボックス

                    // 💡 【逮捕済みの自動削除】C列がTRUEなら画面に出さない
                    if (status === "TRUE" || status.includes("逮捕済み")) continue;
                    if (!text || !text.trim()) continue;

                    // 💡 「特殊指名手配」か「無期限」という文字があれば特殊モードにする
                    const isSpecial = text.includes('特殊指名手配') || text.includes('無期限');

                    // カードを1枚作成
                    const card = document.createElement('div');
                    card.className = `wanted-card ${isSpecial ? 'special-mode' : ''}`;

                    card.innerHTML = `
                        <div class="wanted-badge">${isSpecial ? '特殊指名手配' : 'WANTED'}</div>
                        <div class="text-area">${text}</div>
                    `;
                    container.appendChild(card);
                }

                if (container.innerHTML === '') {
                    container.innerHTML = '<div style="text-align: center; color: #8a99ad; padding: 40px;">現在、有効な指名手配はありません。</div>';
                }
            } catch (error) {
                document.getElementById('wanted-list').innerText = 'データの処理中にエラーが発生しました。';
            }
        }

        // 最初の一回を実行
        fetchList();
        // 3分ごとに自動更新
        setInterval(fetchList, 180000);
    </script>
</body>
</html>
