<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KataCity指名手配リスト</title>
    <style>
        body { font-family: sans-serif; background-color: #11141a; color: #e1e7f0; padding: 20px; margin: 0; }
        h1 { text-align: center; color: #ff3333; letter-spacing: 4px; font-size: 28px; text-transform: uppercase; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #8a99ad; font-size: 14px; margin-bottom: 30px; letter-spacing: 1px; }
        .container { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; max-width: 1200px; margin: 0 auto; }
        .wanted-card { background: #1c2029; border-left: 5px solid #ff3333; border-radius: 4px; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); position: relative; border-top: 1px solid #2d3545; border-right: 1px solid #2d3545; border-bottom: 1px solid #2d3545; }
        .wanted-badge { background: #ff3333; color: #fff; font-weight: bold; padding: 4px 12px; position: absolute; top: 15px; right: 15px; border-radius: 2px; font-size: 11px; letter-spacing: 1px; }
        .limit-time { background: rgba(255, 51, 51, 0.1); border: 1px solid rgba(255, 51, 51, 0.2); color: #ff9999; font-size: 13px; padding: 6px 10px; border-radius: 4px; margin-bottom: 15px; font-weight: bold; }
        .wanted-card.urgent { border-left: 5px solid #ff9900; background: #24211a; border-top: 1px solid #4a3b1a; border-right: 1px solid #4a3b1a; border-bottom: 1px solid #4a3b1a; animation: pulse-border 2s infinite alternate; }
        .wanted-card.urgent .wanted-badge { background: #ff9900; color: #11141a; }
        .wanted-card.urgent .limit-time { background: rgba(255, 153, 0, 0.15); border: 1px solid rgba(255, 153, 0, 0.3); color: #ffb84d; }
        @keyframes pulse-border { 0% { box-shadow: 0 8px 24px rgba(0,0,0,0.4); } 100% { box-shadow: 0 0 20px rgba(255, 153, 0, 0.4); } }
        .reg-time { color:#52637a; font-size:11px; margin-top:-10px; margin-bottom:15px; }
        .section-title { font-size: 12px; color: #8a99ad; text-transform: uppercase; letter-spacing: 1px; margin: 15px 0 5px 0; border-bottom: 1px solid #2d3545; padding-bottom: 3px; font-weight: bold; }
        .toggle-btn { background: #252d3d; border: 1px solid #3b475c; color: #a3b3cc; font-size: 12px; font-weight: bold; cursor: pointer; padding: 8px 12px; border-radius: 4px; width: 100%; text-align: left; margin-top: 10px; display: flex; justify-content: space-between; align-items: center; transition: background 0.2s; }
        .toggle-btn:hover { background: #2d374a; color: #fff; }
        .toggle-content { display: none; background: #151921; padding: 12px; border-radius: 4px; border: 1px dashed #3b475c; margin-top: 5px; }
    </style>
</head>
<body>
    <h1>🚨 KataCity WANTED LIST 🚨</h1>
    <div class="subtitle">CURRENT WANTED SUSPECTS DATABASE</div>
    <div class="container" id="wanted-list">データを読み込み中...</div>
<script>
    const SPREADSHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQD3U8h3RprT9JzloMcWAL04QFXRVYH470r00GnBAYkcRiQ33Qha9tws1ozjEHSm1WYPXC2oLxPzYFy/pub?gid=1025771059&single=true&output=csv";

    function parseCSV(text) {
        let p = '', r = [[]], q = false;
        for (let i = 0; i < text.length; i++) {
            let c = text[i], next = text[i+1];
            if (c === '"') {
                if (q && next === '"') { p += '"'; i++; } else { q = !q; }
            } else if (c === ',' && !q) {
                r[r.length-1].push(p); p = '';
            } else if ((c === '\r' || c === '\n') && !q) {
                if (c === '\r' && next === '\n') { i++; }
                r[r.length-1].push(p); p = '';
                r.push([]);
            } else { p += c; }
        }
        if (p || text[text.length-1] === ',') r[r.length-1].push(p);
        return r.filter(row => row.length > 0);
    }

    function getLimitDate(text) {
        if (!text) return null;
        const match = text.match(/(\d{2})\/(\d{2})\s+(\d{2}):(\d{2})/);
        if (!match) return null;
        const now = new Date();
        const year = now.getFullYear();
        const month = parseInt(match[1], 10) - 1; 
        const day = parseInt(match[2], 10);       
        const hour = parseInt(match[3], 10);      
        const minute = parseInt(match[4], 10);    
        return new Date(year, month, day, hour, minute);
    }
    async function fetchWantedList() {
        try {
            const response = await fetch(SPREADSHEET_CSV_URL + (SPREADSHEET_CSV_URL.includes('?') ? '&' : '?') + "cache=" + new Date().getTime());
            const csvText = await response.text();
            const rows = parseCSV(csvText);
            const container = document.getElementById('wanted-list');
            container.innerHTML = ''; 
            const now = new Date(); 
            let validCards = [];

            for (let i = 1; i < rows.length; i++) {
                const row = rows[i];
                if (!row || row.length < 2) continue; 

                const timestamp = row[0];   // A列: 登録日時
                const discordText = row[1]; // B列: 本文
                const status = row[2] ? row[2].trim().toUpperCase() : ""; // C列: チェックボックス

                // 🚨【手動取り下げ機能】チェックが入っている（TRUE）または「逮捕済み」なら非表示
                if (status === "TRUE" || status.includes("逮捕済み")) {
                    continue; 
                }

                if (!discordText || !discordText.trim()) continue;

                const limitDate = getLimitDate(discordText);
                if (limitDate && limitDate <= now) continue; 

                const sortTime = limitDate ? limitDate.getTime() : 8640000000000000;
                let isUrgent = false;
                if (limitDate) {
                    const diffMs = limitDate.getTime() - now.getTime();
                    const oneHourMs = 60 * 60 * 1000;
                    if (diffMs > 0 && diffMs < oneHourMs) isUrgent = true; 
                }

                // 💡【ダブり修正】B列の「コピペ文の中だけ」から最初の1つ目の日付だけを確実に抜き出す
                let limitTimeStr = "不明";
                const timeMatch = discordText.match(/(\d{2})\/(\d{2})\s+(\d{2}):(\d{2})/);
                if (timeMatch) {
                    limitTimeStr = timeMatch[0]; // 2つ取得せず、最初の「09/26 05:07」だけを正確に指定
                }

                const lines = discordText.split(/[\r\n]+/);
                let suspects = []; let crimes = []; let isCrimeSection = false;

                lines.forEach(line => {
                    let trimmed = line.trim(); if (!trimmed) return;
                    if (trimmed.includes('--- 罪状 ---')) { isCrimeSection = true; }
                    else if (trimmed.startsWith('・')) {
                        if (isCrimeSection) { crimes.push(trimmed); } else { suspects.push(trimmed); }
                    }
                });

                if (suspects.length === 0) suspects.push(discordText);
                let suspectPart = suspects.join('\n');
                let crimePart = crimes.join('\n');

                validCards.push({ id: i, sortTime: sortTime, isUrgent: isUrgent, limitTimeStr: limitTimeStr, timestamp: timestamp, suspectPart: suspectPart, crimePart: crimePart });
            }

            validCards.sort((a, b) => a.sortTime - b.sortTime);

            validCards.forEach(data => {
                const card = document.createElement('div');
                card.className = `wanted-card ${data.isUrgent ? 'urgent' : ''}`;
                card.innerHTML = `
                    <div class="wanted-badge">${data.isUrgent ? 'URGENT' : 'WANTED'}</div>
                    <div class="limit-time">⏱️ 期限: ${data.limitTimeStr} ${data.isUrgent ? '（残り1時間未満！）' : 'まで'}</div>
                    <div class="reg-time">登録: ${data.timestamp}</div>
                    
                    <div class="section-title">👤 容疑者等</div>
                    <div style="white-space: pre-wrap; font-size: 15px; line-height: 1.6; color: #fff; font-weight: bold;">${data.suspectPart}</div>
                    
                    <div class="section-title">⚖️ 罪状</div>
                    <button class="toggle-btn" onclick="toggleSection(${data.id}, this)">
                        <span>罪状を確認 (隠されています)</span> <span>▼</span>
                    </button>
                    <div id="crime-${data.id}" class="toggle-content" style="white-space: pre-wrap; font-size: 14px; line-height: 1.6; color: #ffcc00;">${data.crimePart || '記載なし'}</div>
                `;
                container.appendChild(card);
            });

            if (container.innerHTML === '') {
                container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #8a99ad; padding: 40px; font-size: 15px;">現在、有効な指名手配はありません。</div>';
            }
        } catch (error) {
            document.getElementById('wanted-list').innerText = 'データの処理中にエラーが発生しました。';
        }
    }

    function toggleSection(id, btn) {
        const content = document.getElementById('crime-' + id);
        if (content.style.display === "block") {
            content.style.display = "none";
            btn.style.background = "#252d3d"; btn.style.color = "#a3b3cc";
            btn.innerHTML = "<span>罪状を確認 (隠されています)</span> <span>▼</span>";
        } else {
            content.style.display = "block";
            btn.style.background = "#ffcc00"; btn.style.color = "#11141a";
            btn.innerHTML = "<span>罪状を隠す</span> <span>▲</span>";
        }
    }

    // 3分ごとに自動更新
    setInterval(function() {
        fetchWantedList();
    }, 180000);

    fetchWantedList();
</script>
</body>
</html>
