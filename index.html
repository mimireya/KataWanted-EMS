<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>LOS SANTOS POLICE - 指名手配</title>
    <style>
        body { font-family: sans-serif; background-color: #11141a; color: #fff; padding: 20px; }
        h1 { text-align: center; color: #ff3333; }
        .container { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .wanted-card { background: #1c2029; border-left: 5px solid #ff3333; padding: 15px; border-radius: 4px; }
        .time { color: #8a99ad; font-size: 12px; margin-bottom: 10px; }
        .text { white-space: pre-wrap; font-size: 14px; line-height: 1.6; }
        .toggle-btn { background: #252d3d; border: 1px solid #3b475c; color: #a3b3cc; padding: 6px; width: 100%; text-align: left; cursor: pointer; margin-top: 10px; }
        .toggle-content { display: none; background: #151921; padding: 10px; margin-top: 5px; }
    </style>
</head>
<body>

    <h1>🚨 LOS SANTOS POLICE DEPARTMENT 🚨</h1>
    <div class="container" id="wanted-list">【現在、通信待機中...】</div>

    <script>
<script>
    // ⚠️ ここにスプシのURLを入れてください（最後は pub?gid=xxx&output=csv の形式）
    const SPREADSHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQD3U8h3RprT9JzloMcWAL04QFXRVYH470r00GnBAYkcRiQ33Qha9tws1ozjEHSm1WYPXC2oLxPzYFy/pub?gid=1215928219&single=true&output=csv";

    async function fetchWantedList() {
        try {
            // 通信の裏技（キャッシュを強制無視する設定）を追加してデータを取得
            const response = await fetch(SPREADSHEET_CSV_URL + "&cache=" + new Date().getTime());
            const csvText = await response.text();
            
            const container = document.getElementById('wanted-list');
            
            // 🚨【テスト用】届いた文字データを、そのまま画面にドンと表示させる
            container.innerHTML = `
                <div style="background:#222; padding:15px; border:1px solid #ffcc00; color:#ffcc00; font-family:monospace; white-space:pre-wrap;">
                    【スプシからの通信に成功しました！以下が届いたデータです】\n\n${csvText}
                </div>`;
                
        } catch (error) {
            document.getElementById('wanted-list').innerText = '通信エラーが発生しました: ' + error.message;
        }
    }

    fetchWantedList();
</script>

    </script>
</body>
</html>
