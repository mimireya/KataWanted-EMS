<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOS SANTOS POLICE - 指名手配リスト</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #11141a; color: #e1e7f0; padding: 20px; margin: 0; }
        h1 { text-align: center; color: #ff3333; letter-spacing: 4px; font-size: 28px; text-transform: uppercase; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #8a99ad; font-size: 14px; margin-bottom: 30px; letter-spacing: 1px; }
        .container { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; max-width: 1200px; margin: 0 auto; }
        
        .wanted-card { background: #1c2029; border-left: 5px solid #ff3333; border-radius: 4px; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); position: relative; border-top: 1px solid #2d3545; border-right: 1px solid #2d3545; border-bottom: 1px solid #2d3545; }
        .wanted-badge { background: #ff3333; color: #fff; font-weight: bold; padding: 4px 12px; position: absolute; top: 15px; right: 15px; border-radius: 2px; font-size: 11px; letter-spacing: 1px; }
        .card-title { color: #ff5555; font-size: 18px; font-weight: bold; margin-bottom: 10px; display: flex; align-items: center; gap: 5px; }
        .limit-time { background: rgba(255, 51, 51, 0.1); border: 1px solid rgba(255, 51, 51, 0.2); color: #ff9999; font-size: 13px; padding: 6px 10px; border-radius: 4px; margin-bottom: 15px; font-weight: bold; }
        
        .section-title { font-size: 12px; color: #8a99ad; text-transform: uppercase; letter-spacing: 1px; margin: 15px 0 5px 0; border-bottom: 1px solid #2d3545; padding-bottom: 3px; font-weight: bold; }
        .list-item { font-size: 15px; padding: 4px 0; padding-left: 15px; position: relative; color: #fff; }
        .list-item::before { content: "▪"; color: #ff3333; position: absolute; left: 0; top: 3px; font-size: 10px; }
        .crime-item::before { color: #ffcc00; }
        
        .raw-text-btn { background: none; border: none; color: #52637a; font-size: 11px; cursor: pointer; padding: 0; margin-top: 15px; text-decoration: underline; display: block; }
        .raw-text { display: none; background: #11141a; font-size: 12px; padding: 10px; border-radius: 4px; margin-top: 5px; color: #8a99ad; white-space: pre-wrap; border: 1px solid #2d3545; }
    </style>
</head>
<body>

    <h1>🚨 LOS SANTOS POLICE DEPARTMENT 🚨</h1>
    <div class="subtitle">CURRENT WANTED SUSPECTS DATABASE</div>
    
    <div class="container" id="wanted-list">データを読み込み中...</div>

    <script>
        // ⚠️【ここにスプレッドシートの「ウェブに公開」で取得した .csv のURLを貼り付け】
        const SPREADSHEET_CSV_URL = "ここにウェブ公開したCSVのURLを入れる";

        // 改行やダブルクォーテーションが含まれる複雑なスプシCSVを完璧に分解する関数
        function parseCSV(text) {
            let p = '', r = [[]], q = false;
            for (let i = 0; i < text.length; i++) {
                let c = text[i], next = text[i+1];
                if (c === '"') {
                    if (q && next === '"') { p += '"'; i++; }
                    else { q = !q; }
                } else if (c === ',' && !q) {
                    r[r.length-1].push(p); p = '';
                } else if ((c === '\r' || c === '\n') && !q) {
                    if (c === '\r' && next === '\n') { i++; }
                    r[r.length-1].push(p); p = '';
                    r.push([]);
                } else { p += c; }
            }
            if (p || text[text.length-1] === ',') r[r.length-1].push(p);
            return r.filter(row => row.length > 0);
        }

        async function fetchWantedList() {
            try {
                const response = await fetch(SPREADSHEET_CSV_URL);
                const csvText = await response.text();
                
                // 厳密な方法でCSVを分解
                const rows = parseCSV(csvText);
                const container = document.getElementById('wanted-list');
                container.innerHTML = ''; 

                // 2行目（インデックス1）から処理。最新が上に来るように逆順でループ
                for (let i = rows.length - 1; i >= 1; i--) {
                    const row = rows[i];
                    if (!row || row.length < 2) continue; 

                    const timestamp = row[0];  // A列: タイムスタンプ
                    const discordText = row[1]; // B列: コピペ文
                    if (!discordText || !discordText.trim()) continue;

                    // Discordの本文を行ごとに仕分け
                    const lines = discordText.split(/[\r\n]+/);
                    let limitTime = "不明";
                    let suspects = [];
                    let crimes = [];
                    let isCrimeSection = false;

                    lines.forEach(line => {
                        let trimmed = line.trim();
                        if (!trimmed) return;

                        if (trimmed.includes('🕐️')) {
                            limitTime = trimmed.replace('🕐️', '').trim();
                        } else if (trimmed.includes('--- 罪状 ---')) {
                            isCrimeSection = true;
                        } else if (trimmed.includes('📢 指名手配')) {
                            return;
                        } else if (trimmed.startsWith('・')) {
                            let value = trimmed.replace('・', '').trim();
                            if (value === "") return;
                            
                            if (isCrimeSection) {
                                crimes.push(value);
                            } else {
                                suspects.push(value);
                            }
                        }
                    });

                    // 容疑者も罪状も取れなかった場合は、コピペ文そのものを容疑者枠に入れてカードを出す
                    if (suspects.length === 0 && crimes.length === 0) {
                        suspects.push(discordText);
                    }

                    const card = document.createElement('div');
                    card.className = 'wanted-card';
                    
                    let suspectsHtml = suspects.map(s => `<div class="list-item">${s}</div>`).join('');
                    let crimesHtml = crimes.map(c => `<div class="list-item crime-item">${c}</div>`).join('');

                    card.innerHTML = `
                        <div class="wanted-badge">WANTED</div>
                        <div class="card-title">📢 指名手配令</div>
                        <div class="limit-time">⏱️ 期限: ${limitTime}</div>
                        <div class="limit-time" style="background:none; border:none; color:#52637a; font-size:11px; padding:0; margin-top:-10px; margin-bottom:15px;">登録: ${timestamp}</div>
                        
                        <div class="section-title">👤 容疑者</div>
                        <div>${suspectsHtml}</div>
                        
                        <div class="section-title">⚖️ 罪状</div>
                        <div>${crimesHtml || '<div style="color:#52637a; font-size:14px;">-</div>'}</div>
                        
                        <button class="raw-text-btn" onclick="toggleRaw(this)">元文を表示</button>
                        <div class="raw-text">${discordText}</div>
                    `;
                    container.appendChild(card);
                }
            } catch (error) {
                console.error('データの取得に失敗しました:', error);
                document.getElementById('wanted-list').innerText = 'データの読み込みに失敗しました。';
            }
        }

        function toggleRaw(btn) {
            const rawDiv = btn.nextElementSibling;
            if (rawDiv.style.display === "block") {
                rawDiv.style.display = "none";
                btn.innerText = "元文を表示";
            } else {
                rawDiv.style.display = "block";
                btn.innerText = "元文を隠す";
            }
        }

        fetchWantedList();
    </script>
</body>
</html>
