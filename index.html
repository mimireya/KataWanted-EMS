<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>指名手配リスト</title>
    <style>
        /* --- 基本のページデザイン --- */
        body {
            background-color: #11141a;
            color: #fff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        /* --- 🔲 グリッド全体の列数コントロール --- */
        #wanted-list {
            display: grid;
            gap: 16px;
            width: 100%;
        }

        /* 「小」：3列 */
        #wanted-list[data-size="small"] {
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        }

        /* 「中」：2列（標準） */
        #wanted-list[data-size="medium"] {
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
        }

        /* 「大」：1列表示 */
        #wanted-list[data-size="large"] {
            grid-template-columns: 1fr;
        }

        /* --- 基本のカードデザイン --- */
        .wanted-card {
            background: #171d26;
            border: 1px solid #252d3d;
            border-radius: 8px;
            position: relative;
            box-sizing: border-box;
        }

        /* --- 各サイズごとの文字・余白の定義 --- */
        .wanted-card[data-size="small"] { padding: 10px; }
        .wanted-card[data-size="small"] .suspect-text { font-size: 12px; }
        .wanted-card[data-size="small"] .toggle-content { font-size: 12px; }
        .wanted-card[data-size="small"] .section-title { font-size: 11px; margin-top: 8px; }
        .wanted-card[data-size="small"] .limit-time { font-size: 11px; }

        .wanted-card[data-size="medium"] { padding: 16px; }
        .wanted-card[data-size="medium"] .suspect-text { font-size: 15px; }
        .wanted-card[data-size="medium"] .toggle-content { font-size: 14px; }
        .wanted-card[data-size="medium"] .section-title { font-size: 12px; margin-top: 12px; }

        .wanted-card[data-size="large"] { padding: 22px; }
        .wanted-card[data-size="large"] .suspect-text { font-size: 19px; }
        .wanted-card[data-size="large"] .toggle-content { font-size: 17px; }
        .wanted-card[data-size="large"] .section-title { font-size: 14px; margin-top: 16px; }

        /* --- 通常のバッジや装飾 --- */
        .wanted-badge {
            display: inline-block;
            padding: 4px 8px;
            background: #ff3333;
            color: #fff;
            font-weight: bold;
            font-size: 11px;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .wanted-card.urgent .wanted-badge {
            background: #ffcc00;
            color: #11141a;
        }
        .section-title {
            color: #8a99ad;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        .toggle-btn {
            display: flex;
            justify-content: space-between;
            width: 100%;
            padding: 8px 12px;
            background: #252d3d;
            border: none;
            color: #a3b3cc;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            margin-top: 5px;
        }
        .toggle-content {
            display: none;
            margin-top: 10px;
            padding: 10px;
            background: #11141a;
            border-radius: 4px;
        }

        /* --- 👑 特殊指名手配（無期限）用の特別カードデザイン --- */
        .wanted-card.indefinite {
            border: 2px solid #b300ff !important;
            background: linear-gradient(135deg, #1b1124 0%, #11091a 100%) !important;
            box-shadow: 0 0 15px rgba(179, 0, 255, 0.2);
        }
        .wanted-card.indefinite .wanted-badge {
            background: linear-gradient(90deg, #b300ff 0%, #d4af37 100%) !important;
            color: #fff !important;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>
    <!-- 💡 サイズ変更ボタンを設置するエリア -->
    <div id="size-controller" style="margin-bottom: 15px; display: flex; gap: 8px; align-items: center;">
        <span style="font-size: 14px; color: #a3b3cc; font-weight: bold;">🔲 カードの大きさ:</span>
        <button onclick="changeCardSize('small')" style="padding: 6px 12px; background: #252d3d; color: #fff; border: 1px solid #3b485e; border-radius: 4px; cursor: pointer; font-size: 13px;">小（複数列）</button>
        <button onclick="changeCardSize('medium')" style="padding: 6px 12px; background: #252d3d; color: #fff; border: 1px solid #3b485e; border-radius: 4px; cursor: pointer; font-size: 13px;">中</button>
        <button onclick="changeCardSize('large')" style="padding: 6px 12px; background: #252d3d; color: #fff; border: 1px solid #3b485e; border-radius: 4px; cursor: pointer; font-size: 13px;">大（1列表示）</button>
    </div>

    <!-- 💡 指名手配カードが並ぶコンテナ -->
    <div id="wanted-list" data-size="medium"></div>

    <script>
        // ⚠️ ご自身のご利用中のスプレッドシートCSVのURLをここに貼り付けてください
        const SPREADSHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQD3U8h3RprT9JzloMcWAL04QFXRVYH470r00GnBAYkcRiQ33Qha9tws1ozjEHSm1WYPXC2oLxPzYFy/pub?gid=1025771059&single=true&output=csv";

        let currentSize = localStorage.getItem('wanted-card-size') || 'medium';

        function changeCardSize(size) {
            currentSize = size;
            localStorage.setItem('wanted-card-size', size);
            updateButtonStyles();
            const container = document.getElementById('wanted-list');
            if (container) container.setAttribute('data-size', size);
            const cards = document.querySelectorAll('.wanted-card');
            cards.forEach(card => card.setAttribute('data-size', size));
        }

        function updateButtonStyles() {
            const buttons = document.querySelectorAll('#size-controller button');
            const sizes = ['small', 'medium', 'large'];
            buttons.forEach((btn, index) => {
                if (sizes[index] === currentSize) {
                    btn.style.background = "#ffcc00";
                    btn.style.color = "#11141a";
                    btn.style.fontWeight = "bold";
                } else {
                    btn.style.background = "#252d3d";
                    btn.style.color = "#fff";
                    btn.style.fontWeight = "normal";
                }
            });
        }

        // 簡易CSVパース関数
        function parseCSV(text) {
            return text.split('\n').map(row => {
                let fields = []; let field = ''; let inQuotes = false;
                for (let i = 0; i < row.length; i++) {
                    let c = row[i];
                    if (c === '"') { inQuotes = !inQuotes; }
                    else if (c === ',' && !inQuotes) { fields.push(field); field = ''; }
                    else { field += c; }
                }
                fields.push(field); return fields;
            });
        }

        // 💡 期限日時を安全に計算・抽出する強化版関数
        function getLimitDate(text) {
            if (text.includes('無期限')) return null;
            const timeMatch = text.match(/(\d{2})\/(\d{2})\s+(\d{2}):(\d{2})/);
            if (!timeMatch) return null;
            const now = new Date();
            // 月、日、時、分をパースしてDateオブジェクトを作成
            const date = new Date(now.getFullYear(), parseInt(timeMatch[1]) - 1, parseInt(timeMatch[2]), parseInt(timeMatch[3]), parseInt(timeMatch[4]));
            return date;
        }
        async function fetchWantedList() {
            try {
                const forceFreshUrl = SPREADSHEET_CSV_URL + (SPREADSHEET_CSV_URL.includes('?') ? '&' : '?') + "nocache=" + Math.floor(Date.now() / 1000);
                const response = await fetch(forceFreshUrl);
                const csvText = await response.text();
                const rows = parseCSV(csvText);
                const container = document.getElementById('wanted-list');
                container.innerHTML = ''; 
                container.setAttribute('data-size', currentSize);

                const now = new Date(); 
                let validCards = [];

                for (let i = 1; i < rows.length; i++) {
                    const row = rows[i];
                    if (!row || row.length < 2) continue; 

                    const discordText = row[1]; 
                    const status = row[2] ? row[2].trim().toUpperCase() : ""; 

                    if (status === "TRUE" || status.includes("逮捕済み")) continue; 
                    if (!discordText || !discordText.trim()) continue;

                    const isIndefinite = discordText.includes('無期限');
                    const limitDate = getLimitDate(discordText);
                    if (!isIndefinite && limitDate && limitDate <= now) continue; 

                    const sortTime = isIndefinite ? 0 : (limitDate ? limitDate.getTime() : 8640000000000000);
                    
                    let isUrgent = false;
                    if (!isIndefinite && limitDate) {
                        const diffMs = limitDate.getTime() - now.getTime();
                        const oneHourMs = 60 * 60 * 1000;
                        if (diffMs > 0 && diffMs < oneHourMs) isUrgent = true; 
                    }

                    // 💡 期限表示のテキストの取得方法を修正
                    let limitTimeStr = "不明";
                    if (isIndefinite) {
                        limitTimeStr = "無期限 🕐️";
                    } else {
                        const timeMatch = discordText.match(/(\d{2})\/(\d{2})\s+(\d{2}):(\d{2})/);
                        if (timeMatch) limitTimeStr = timeMatch[0]; 
                    }

                    const lines = discordText.split(/[\r\n]+/);
                    let suspects = []; let crimes = []; let isCrimeSection = false;

                    lines.forEach(line => {
                        let trimmed = line.trim(); if (!trimmed) return;
                        if (trimmed.includes('特殊指名手配') || trimmed.includes('無期限')) return;
                        if (trimmed.includes('--- 罪状 ---')) { isCrimeSection = true; }
                        else if (trimmed.startsWith('・')) {
                            if (isCrimeSection) { crimes.push(trimmed); } else { suspects.push(trimmed); }
                        }
                    });

                    if (suspects.length === 0) suspects.push(discordText);
                    let suspectPart = suspects.join('\n');
                    let crimePart = crimes.join('\n');

                    validCards.push({ id: i, sortTime: sortTime, isUrgent: isUrgent, isIndefinite: isIndefinite, limitTimeStr: limitTimeStr, suspectPart: suspectPart, crimePart: crimePart });
                }

                validCards.sort((a, b) => a.sortTime - b.sortTime);

                validCards.forEach(data => {
                    const card = document.createElement('div');
                    card.className = `wanted-card ${data.isUrgent ? 'urgent' : ''} ${data.isIndefinite ? 'indefinite' : ''}`;
                    card.setAttribute('data-size', currentSize);
                    
                    let badgeText = data.isUrgent ? 'URGENT' : (data.isIndefinite ? '特殊指名手配' : 'WANTED');
                    let timeDisplayText = data.isIndefinite ? `⏱️ 期限: ${data.limitTimeStr}` : `⏱️ 期限: ${data.limitTimeStr} ${data.isUrgent ? '（残り1時間未満！）' : 'まで'}`;
                    
                    // 💡 登録日時の表示部分を綺麗に削除しました
                    card.innerHTML = `
                        <div class="wanted-badge">${badgeText}</div>
                        <div class="limit-time">${timeDisplayText}</div>
                        
                        <div class="section-title">👤 容疑者等</div>
                        <div class="suspect-text" style="white-space: pre-wrap; font-weight: bold; color: #fff;">${data.suspectPart}</div>
                        <div class="section-title">⚖️ 罪状</div>
                        <button class="toggle-btn" onclick="toggleSection(${data.id}, this)">
                            <span>罪状を確認 (隠されています)</span> <span>▼</span>
                        </button>
                        <div id="crime-${data.id}" class="toggle-content" style="white-space: pre-wrap; color: #ffcc00;">${data.crimePart || '記載なし'}</div>
                    `;
                    container.appendChild(card);
                });

                if (container.innerHTML === '') {
                    container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #8a99ad; padding: 40px; font-size: 15px;">現在、有効な指名手配はありません。</div>';
                }
            } catch (error) {
                document.getElementById('wanted-list').innerText = 'データの処理中にエラーが発生しました。';
            }
        }

        function toggleSection(id, btn) {
            const content = document.getElementById('crime-' + id);
            if (content.style.display === "block") {
                content.style.display = "none";
                btn.style.background = "#252d3d"; btn.style.color = "#a3b3cc";
                btn.innerHTML = "<span>罪状を確認 (隠されています)</span> <span>▼</span>";
            } else {
                content.style.display = "block";
                btn.style.background = "#ffcc00"; btn.style.color = "#11141a";
                btn.innerHTML = "<span>罪状を隠す</span> <span>▲</span>";
            }
        }

        setInterval(function() { fetchWantedList(); }, 180000);
        updateButtonStyles();
        fetchWantedList();
    </script>
</body>
</html>
