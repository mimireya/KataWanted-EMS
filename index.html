<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>KataCity指名手配リスト</title>
    <style>
        body { background: #11141a; color: #fff; font-family: sans-serif; padding: 20px; }
        #wanted-list { display: grid; gap: 16px; width: 100%; }
        #wanted-list[data-size="small"] { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
        #wanted-list[data-size="medium"] { grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); }
        #wanted-list[data-size="large"] { grid-template-columns: 1fr; }
        .wanted-card { background: #171d26; border: 1px solid #252d3d; border-radius: 8px; padding: 16px; box-sizing: border-box; transition: all 0.3s ease; }
        .wanted-badge { display: inline-block; padding: 4px 8px; background: #ff3333; color: #fff; font-weight: bold; font-size: 11px; border-radius: 4px; margin-bottom: 12px; }
        .limit-time { font-size: 14px; color: #ffcc00; font-weight: bold; margin-bottom: 12px; }
        .section-title { color: #8a99ad; font-size: 12px; font-weight: bold; margin-bottom: 6px; margin-top: 14px; border-left: 3px solid #3b485e; padding-left: 6px; }
        .suspect-text { white-space: pre-wrap; font-weight: bold; font-size: 16px; color: #fff; line-height: 1.5; }
        .toggle-btn { display: flex; justify-content: space-between; width: 100%; padding: 8px 12px; background: #252d3d; border: none; color: #a3b3cc; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; margin-top: 6px; }
        .toggle-content { display: none; margin-top: 8px; padding: 12px; background: #11141a; border-radius: 4px; white-space: pre-wrap; color: #ffcc00; font-size: 14px; line-height: 1.5; font-weight: bold; }
        
        /* 👑 特殊指名手配（無期限）用の特別紫デザイン */
        .wanted-card.special-mode { border: 2px solid #b300ff !important; background: linear-gradient(135deg, #1b1124 0%, #11091a 100%) !important; box-shadow: 0 0 15px rgba(179, 0, 255, 0.2); }
        .wanted-card.special-mode .wanted-badge { background: linear-gradient(90deg, #b300ff 0%, #d4af37 100%) !important; }

        /* 🚨 【修正】残り30分未満の警告カードデザイン（柔らかいオレンジ色に点滅） */
        .wanted-card.alert-mode { border: 2px solid #ff9900 !important; box-shadow: 0 0 15px rgba(255, 153, 0, 0.4); animation: pulseAlert 2.5s infinite; }
        .wanted-card.alert-mode .wanted-badge { background: #ff9900 !important; color: #11141a !important; }
        .wanted-card.alert-mode .limit-time { color: #ff9900 !important; }
        @keyframes pulseAlert {
            0% { box-shadow: 0 0 15px rgba(255, 153, 0, 0.3); }
            50% { box-shadow: 0 0 4px rgba(255, 153, 0, 0.1); }
            100% { box-shadow: 0 0 15px rgba(255, 153, 0, 0.3); }
        }
    </style>
</head>
<body>

    <div style="margin-bottom: 15px; display: flex; gap: 8px; align-items: center;">
        <span style="font-size: 14px; color: #a3b3cc; font-weight: bold;">🔲 カードの大きさ:</span>
        <button onclick="changeSize('small')" style="padding: 6px 12px; background: #252d3d; color: #fff; border: 1px solid #3b485e; cursor: pointer; border-radius: 4px;">小</button>
        <button onclick="changeSize('medium')" style="padding: 6px 12px; background: #252d3d; color: #fff; border: 1px solid #3b485e; cursor: pointer; border-radius: 4px;">中</button>
        <button onclick="changeSize('large')" style="padding: 6px 12px; background: #252d3d; color: #fff; border: 1px solid #3b485e; cursor: pointer; border-radius: 4px;">大</button>
    </div>

    <div id="wanted-list" data-size="medium"></div>
    <script>
        // ⚠️ ここにご自身のGoogleスプレッドシートのCSV URLを確実に貼り付けてください
        const SPREADSHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQD3U8h3RprT9JzloMcWAL04QFXRVYH470r00GnBAYkcRiQ33Qha9tws1ozjEHSm1WYPXC2oLxPzYFy/pub?gid=1025771059&single=true&output=csv";

        function changeSize(size) {
            document.getElementById('wanted-list').setAttribute('data-size', size);
        }

        function robustParseCSV(text) {
            let lines = [], row = [], currentCell = '', inQuotes = false;
            if (!text) return lines;
            for (let i = 0; i < text.length; i++) {
                let char = text[i], nextChar = text[i + 1];
                if (char === '"') {
                    if (inQuotes && nextChar === '"') { currentCell += '"'; i++; } else { inQuotes = !inQuotes; }
                } else if (char === ',' && !inQuotes) { row.push(currentCell); currentCell = ''; }
                else if ((char === '\r' || char === '\n') && !inQuotes) {
                    if (char === '\r' && nextChar === '\n') i++;
                    row.push(currentCell); lines.push(row); row = []; currentCell = '';
                } else { currentCell += char; }
            }
            if (currentCell || row.length > 0) { row.push(currentCell); lines.push(row); }
            return lines;
        }

        function parseLimitDateObj(text) {
            if (!text || text.includes('無期限')) return null;
            const timeMatch = text.match(/(\d{1,2})\/(\d{1,2})\s+(\d{1,2}):(\d{1,2})/);
            if (!timeMatch) return null;
            const now = new Date();
            return new Date(2026, parseInt(timeMatch[10]) - 1, parseInt(timeMatch[10]), parseInt(timeMatch[10]), parseInt(timeMatch[10]));
        }

        async function fetchList() {
            try {
                const response = await fetch(SPREADSHEET_CSV_URL + (SPREADSHEET_CSV_URL.includes('?') ? '&' : '?') + "nocache=" + Date.now());
                const csvText = await response.text();
                const allRows = robustParseCSV(csvText);
                const container = document.getElementById('wanted-list');
                container.innerHTML = '';

                let validCards = [];
                // 💡 重複を防ぐための部屋
                let processedKeys = new Set(); 
                const now = new Date();

                for (let i = 1; i < allRows.length; i++) {
                    const currentRow = allRows[i];
                    if (!currentRow || currentRow.length < 2) continue;

                    const targetText = currentRow[1]; // B列：コピペ本文
                    const targetStatus = currentRow[2] ? currentRow[2].trim().toUpperCase() : ""; // C列：チェックボックス

                    if (targetStatus === "TRUE" || targetStatus.includes("逮捕済み")) continue;
                    if (!targetText || !targetText.trim()) continue;

                    const isSpecial = targetText.includes('特殊指名手配') || targetText.includes('無期限');
                    const limitDate = parseLimitDateObj(targetText);

                    if (!isSpecial && limitDate && limitDate <= now) continue;

                    let limitTimeStr = "不明";
                    if (isSpecial) {
                        limitTimeStr = "無期限 🕐️";
                    } else {
                        const timeMatch = targetText.match(/(\d{1,2}\/\d{1,2}\s+\d{1,2}:\d{1,2})/);
                        if (timeMatch) limitTimeStr = timeMatch[1] + " まで";
                    }

                    const lines = targetText.split(/[\r\n]+/);
                    let suspects = [], crimes = [], isCrimeSection = false;

                    lines.forEach(line => {
                        let trimmed = line.trim();
                        if (!trimmed || trimmed.includes('指名手配') || trimmed.includes('無期限') || trimmed.includes('まで') || trimmed.includes('🕐️')) return;
                        if (trimmed.includes('--- 罪状 ---')) { isCrimeSection = true; } 
                        else if (trimmed.startsWith('・')) {
                            if (isCrimeSection) { crimes.push(trimmed); } else { suspects.push(trimmed); }
                        } else {
                            if (isCrimeSection) { crimes.push("・" + trimmed); } else { suspects.push("・" + trimmed); }
                        }
                    });

                    if (suspects.length === 0) suspects.push("・記載なし");
                    let suspectPart = suspects.join('\n'), crimePart = crimes.join('\n');

                    // 💡 【安全な重複チェック】名前と期限をくっつけた文字（例:「・ああ太郎09/2705:41」）を鍵にします
                    const uniqueKey = suspectPart.replace(/\s+/g, '') + limitTimeStr.replace(/\s+/g, '');
                    if (processedKeys.has(uniqueKey)) {
                        continue; // 名前と期限が完全に一致するカードがすでにあれば飛ばす
                    }
                    processedKeys.add(uniqueKey);

                    let isUnder30Min = false;
                    if (!isSpecial && limitDate) {
                        const diffMs = limitDate.getTime() - now.getTime();
                        if (diffMs > 0 && diffMs < 30 * 60 * 1000) {
                            isUnder30Min = true;
                        }
                    }

                    // 30分未満ならテキストに警告をくっつける
                    if (!isSpecial && isUnder30Min) {
                        limitTimeStr += " 🚨（残り30分未満！）";
                    }

                    const sortTime = isSpecial ? 0 : (limitDate ? limitDate.getTime() : 8640000000000000);

                    validCards.push({
                        id: i,
                        sortTime: sortTime,
                        isSpecial: isSpecial,
                        isUnder30Min: isUnder30Min,
                        limitTimeStr: limitTimeStr,
                        suspectPart: suspectPart,
                        crimePart: crimePart
                    });
                }

                // 期限が近い順に並び替え
                validCards.sort((a, b) => a.sortTime - b.sortTime);

                validCards.forEach(data => {
                    const cardElement = document.createElement('div');
                    if (data.isSpecial) {
                        cardElement.className = "wanted-card special-mode";
                    } else if (data.isUnder30Min) {
                        cardElement.className = "wanted-card alert-mode";
                    } else {
                        cardElement.className = "wanted-card";
                    }

                    const badgeName = data.isSpecial ? '特殊指名手配' : (data.isUnder30Min ? '🚨 URGENT' : 'WANTED');

                    cardElement.innerHTML = `
                        <div class="wanted-badge">${badgeName}</div>
                        <div class="limit-time">⏱️ 期限: ${data.limitTimeStr}</div>
                        <div class="section-title">👤 犯人</div>
                        <div class="suspect-text">${data.suspectPart}</div>
                        <div class="section-title">⚖️ 詳細</div>
                        <button class="toggle-btn" onclick="toggleSection(${data.id}, this)">
                            <span>罪状を確認 (隠されています)</span> <span>▼</span>
                        </button>
                        <div id="crime-${data.id}" class="toggle-content">${data.crimePart || '・記載なし'}</div>
                    `;
                    container.appendChild(cardElement);
                });

                if (container.innerHTML === '') {
                    container.innerHTML = '<div style="text-align: center; color: #8a99ad; padding: 40px; font-size: 15px;">現在、有効な指名手配はありません。</div>';
                }
            } catch (error) {
                document.getElementById('wanted-list').innerText = 'データの処理中にエラーが発生しました。';
            }
        }

        function toggleSection(id, btn) {
            const content = document.getElementById('crime-' + id);
            if (content.style.display === "block") {
                content.style.display = "none";
                btn.style.background = "#252d3d"; btn.style.color = "#a3b3cc";
                btn.innerHTML = "<span>詳細を確認 (隠されています)</span> <span>▼</span>";
            } else {
                content.style.display = "block";
                btn.style.background = "#ffcc00"; btn.style.color = "#11141a";
                btn.innerHTML = "<span>詳細を隠す</span> <span>▲</span>";
            }
        }

        fetchList();
        setInterval(fetchList, 180000);
    </script>
</body>
</html>
