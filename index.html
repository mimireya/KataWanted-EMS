<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KataCity 指名手配犯リスト</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #ef4444;
            letter-spacing: 2px;
            border-bottom: 2px solid #ef4444;
            padding-bottom: 10px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        #wanted-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .card {
            background-color: #1e293b;
            border: 2px solid #334155;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }
        .name {
            font-size: 1.5rem;
            font-weight: bold;
            color: #f8fafc;
            margin-bottom: 10px;
            border-bottom: 1px solid #334155;
            padding-bottom: 5px;
        }
        .info-label {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-top: 10px;
        }
        .time {
            font-size: 1.1rem;
            color: #fbbf24;
            font-weight: bold;
        }
        .charges {
            font-size: 1rem;
            color: #f1f5f9;
            background-color: #0f172a;
            padding: 8px;
            border-radius: 4px;
            margin-top: 5px;
            white-space: pre-wrap;
        }
        #loading {
            text-align: center;
            color: #64748b;
            margin-top: 50px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🚨 LSPD MOST WANTED LIST 🚨</h1>
    <div id="loading">データを読み込み中...</div>
    <div id="wanted-grid"></div>
</div>

<script>
    // ★★★ あなたのCSV URLをここに貼り付けてください ★★★
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQWKeE9aWSvmkzhJukH5F4qOKbjnnq7EMhwjXeFygS7YhY5h6OwIMGP0X71nvUm7nhE5MVMDxel7g4M/pub?gid=1408368286&single=true&output=csv'; 

    async function fetchWantedList() {
        try {
            const response = await fetch(CSV_URL + (CSV_URL.includes('?') ? '&' : '?') + 'nocache=' + new Date().getTime());
            const csvText = await response.text();
            
            // 最もシンプルで壊れない単純なカンマ区切りに修正
            const rows = csvText.split(/\r?\n/).map(row => row.split(','));
            const grid = document.getElementById('wanted-grid');
            const loading = document.getElementById('loading');
            
            let hasItems = false;
            let cardHTML = ''; // 描画を1回にまとめてチカチカ（画面のちらつき）を完全に防止

            for (let i = 1; i < rows.length; i++) {
                const columns = rows[i];
                if (!columns || columns.length < 3) continue;

                // 空白行を徹底排除
                const checkText = columns.join('').replace(/"/g, '').trim();
                if (checkText === "") continue;

                hasItems = true;
                
                // 列から余計なダブルクォーテーション（"）を綺麗に消し去る
                const timeData = columns[0].replace(/"/g, '').trim();    // A列：期限
                const nameData = columns[1].replace(/"/g, '').trim();    // B列：名前
                const chargesData = columns[2].replace(/"/g, '').trim(); // C列：罪状

                // HTML文字列を後ろにどんどん追加していく
                cardHTML += `
                    <div class="card">
                        <div class="name">${nameData}</div>
                        <div class="info-label">⏱️ 手配期限</div>
                        <div class="time">${timeData} まで</div>
                        <div class="info-label">⚖️ 罪状</div>
                        <div class="charges">${chargesData}</div>
                    </div>
                `;
            }

            loading.style.display = 'none';

            if (hasItems) {
                grid.innerHTML = cardHTML; // ここで一気に画面を書き換える（ついたり消えたりしなくなります）
            } else {
                grid.innerHTML = '<div style="text-align:center; width:100%; color:#64748b; margin-top:20px;">現在、指名手配犯はいません。</div>';
            }

        } catch (error) {
            document.getElementById('loading').innerText = 'データの取得に失敗しました。URLの設定を確認してください。';
            console.error('Error:', error);
        }
    }

    // 最初に実行
    fetchWantedList();
    // 5分ごとに自動更新（300000ミリ秒）
    setInterval(fetchWantedList, 300000);

</script>

</body>
</html>
