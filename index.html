<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>指名手配リスト</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #ef4444;
            letter-spacing: 2px;
            border-bottom: 2px solid #ef4444;
            padding-bottom: 10px;
            text-transform: uppercase;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        #wanted-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .card {
            background-color: #1e293b;
            border: 2px solid #334155;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }
        .name {
            font-size: 1.3rem;
            font-weight: bold;
            color: #f8fafc;
            margin-top: 5px;
            background-color: #0f172a;
            padding: 12px;
            border-radius: 6px;
            border-left: 4px solid #ef4444;
            white-space: pre-wrap;
            line-height: 1.6;
        }
        .info-label {
            color: #94a3b8;
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 15px;
        }
        .card > .info-label:first-child {
            margin-top: 0;
        }
        .time {
            font-size: 1.15rem;
            color: #fbbf24;
            font-weight: bold;
            margin-top: 5px;
        }
        #loading {
            text-align: center;
            color: #64748b;
            margin-top: 50px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🚨 LSPD MOST WANTED LIST 🚨</h1>
    <div id="loading">データを読み込み中...</div>
    <div id="wanted-grid"></div>
</div>

<script>
    // あなたの「フォームの回答」シートのCSV URLをセットしました！
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQWKeE9aWSvmkzhJukH5F4qOKbjnnq7EMhwjXeFygS7YhY5h6OwIMGP0X71nvUm7nhE5MVMDxel7g4M/pub?gid=1501548881&single=true&output=csv'; 

    function parseCSV(text) {
        let lines = [];
        let row = [""];
        let inQuotes = false;

        for (let i = 0; i < text.length; i++) {
            let col = text[i];
            let nextCol = text[i+1];

            if (col === '"') {
                if (inQuotes && nextCol === '"') { row[row.length - 1] += '"'; i++; }
                else { inQuotes = !inQuotes; }
            } else if (col === ',' && !inQuotes) {
                row.push('');
            } else if ((col === '\r' || col === '\n') && !inQuotes) {
                if (col === '\r' && nextCol === '\n') { i++; }
                lines.push(row);
                row = [''];
            } else {
                row[row.length - 1] += col;
            }
        }
        if (row.length > 1 || row !== "") {
            lines.push(row);
        }
        return lines;
    }

    async function fetchWantedList() {
        try {
            // nocacheを付けてGoogle側の5分キャッシュを強制突破します
            const response = await fetch(CSV_URL + (CSV_URL.includes('?') ? '&' : '?') + 'nocache=' + new Date().getTime());
            const csvText = await response.text();
            
            const rows = parseCSV(csvText);
            const grid = document.getElementById('wanted-grid');
            const loading = document.getElementById('loading');
            
            let validItems = []; 
            const now = new Date(); // ホームページを開いた「本当の今の日時」

            // 1行目はヘッダー（タイムスタンプ等）なので i=1 からスタート
            for (let i = 1; i < rows.length; i++) {
                const columns = rows[i];
                // 列が足りないデータはスキップ
                if (!columns || columns.length < 6) continue;

                // スプシの列位置（B列=1, C列=2, D列=3, E列=4, F列=5）
                const timeStr = columns[1] ? columns[1].trim() : '';      // B列: 期限(09/25 05:04など)
                const nameData = columns[2] ? columns[2].trim() : '';     // C列: 名前
                const status = columns[4] ? columns[4].trim() : '';       // E列: ステータス(逮捕済など)
                const realTimeStr = columns[5] ? columns[5].trim() : '';  // F列: 判定用日時(2026/09/25 05:04:00)

                // 【自動判定1】「逮捕済」なら絶対に表示しない
                if (status === "逮捕済") continue;
                
                // 【自動判定2】名前が空っぽなら表示しない
                if (!nameData) continue;

                // 【自動判定3】期限切れチェック（F列の日時データを使用）
                if (realTimeStr) {
                    const expireDate = new Date(realTimeStr);
                    // 期限が「今の時間」より古ければ、自動でスキップ（非表示）
                    if (!isNaN(expireDate) && expireDate < now) {
                        continue; 
                    }
                }

                // すべての条件をクリアしたデータだけを一時保存
                validItems.push({
                    time: timeStr ? timeStr : '未設定',
                    name: nameData,
                    expireTime: realTimeStr ? new Date(realTimeStr).getTime() : 0
                });
            }

            // 【自動並び替え】手配期限が近い順（昇順）に並び替えます
            validItems.sort((a, b) => a.expireTime - b.expireTime);

            // 画面に表示するHTMLを組み立て
            let cardHTML = '';
            for (const item of validItems) {
                cardHTML += `
                    <div class="card">
                        <div class="info-label">⏱️ 手配期限</div>
                        <div class="time">${item.time} まで</div>
                        <div class="info-label">👤 指名手配犯</div>
                        <div class="name">${item.name}</div>
                    </div>
                `;
            }

            loading.style.display = 'none';

            if (validItems.length > 0) {
                grid.innerHTML = cardHTML; 
            } else {
                grid.innerHTML = '<div style="text-align:center; width:100%; color:#64748b; margin-top:20px;">現在、指名手配犯はいません。</div>';
            }

        } catch (error) {
            document.getElementById('loading').innerText = 'データの取得に失敗しました。';
            console.error('Error:', error);
        }
    }

    fetchWantedList();
    setInterval(fetchWantedList, 180000); // 3分ごとに自動更新
</script>

</body>
</html>
