<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KataCity 指名手配犯リスト</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #ef4444;
            letter-spacing: 2px;
            border-bottom: 2px solid #ef4444;
            padding-bottom: 10px;
            text-transform: uppercase;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        #wanted-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .card {
            background-color: #1e293b;
            border: 2px solid #334155;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }
        .name {
            font-size: 1.4rem;
            font-weight: bold;
            color: #f8fafc;
            margin-bottom: 15px;
            background-color: #0f172a;
            padding: 12px;
            border-radius: 6px;
            border-left: 4px solid #ef4444;
            white-space: pre-wrap; /* 複数人の改行（・山田\n・スズキ）をそのまま綺麗に表示する */
            line-height: 1.5;
        }
        .info-label {
            color: #94a3b8;
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .time {
            font-size: 1.15rem;
            color: #fbbf24;
            font-weight: bold;
            margin-top: 5px;
        }
        #loading {
            text-align: center;
            color: #64748b;
            margin-top: 50px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🚨 LSPD MOST WANTED LIST 🚨</h1>
    <div id="loading">データを読み込み中...</div>
    <div id="wanted-grid"></div>
</div>

<script>
    // ★★★ あなたのCSV URLをここに貼り付けてください ★★★
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQWKeE9aWSvmkzhJukH5F4qOKbjnnq7EMhwjXeFygS7YhY5h6OwIMGP0X71nvUm7nhE5MVMDxel7g4M/pub?gid=1408368286&single=true&output=csv'; 

    async function fetchWantedList() {
        try {
            const response = await fetch(CSV_URL + (CSV_URL.includes('?') ? '&' : '?') + 'nocache=' + new Date().getTime());
            const csvText = await response.text();
            
            // CSVを「行」に分解
            const rows = csvText.split(/\r?\n/).map(row => row.split(','));
            const grid = document.getElementById('wanted-grid');
            const loading = document.getElementById('loading');
            
            let hasItems = false;
            let cardHTML = ''; 

            // 1行目は見出しなので無視、2行目から処理
            for (let i = 1; i < rows.length; i++) {
                const columns = rows[i];
                if (!columns || columns.length < 2) continue;

                // 空白行を排除
                const checkText = columns.join('').replace(/"/g, '').trim();
                if (checkText === "") continue;

                hasItems = true;
                
                // 【あなたの列順（A=期限、B=名前）に完璧に固定しました】
                // ダブルクォーテーションを消し、スプレッドシート内の改行コード(;)をWebサイトの改行(\n)に変換
                const timeData = columns[0].replace(/"/g, '').trim();    // A列：手配期限
                const nameData = columns[1].replace(/"/g, '').replace(/;/g, '\n').trim();  // B列：名前（複数人の改行に対応）

                // カードの組み立て（罪状は完全に削除しました）
                cardHTML += `
                    <div class="card">
                        <div class="info-label">👤 指名手配犯</div>
                        <div class="name">${nameData}</div>
                        <div class="info-label">⏱️ 手配期限</div>
                        <div class="time">${timeData} まで</div>
                    </div>
                `;
            }

            loading.style.display = 'none';

            if (hasItems) {
                grid.innerHTML = cardHTML; 
            } else {
                grid.innerHTML = '<div style="text-align:center; width:100%; color:#64748b; margin-top:20px;">現在、指名手配犯はいません。</div>';
            }

        } catch (error) {
            document.getElementById('loading').innerText = 'データの取得に失敗しました。';
            console.error('Error:', error);
        }
    }

    // 最初に実行
    fetchWantedList();
    // ご希望通り「5分ごと（300,000ミリ秒）」にゆったり自動更新します
    setInterval(fetchWantedList, 300000);
</script>

</body>
</html>
