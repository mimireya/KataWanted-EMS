<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>KataCity指名手配リスト</title>
    <style>
        body { background: #11141a; color: #fff; font-family: sans-serif; padding: 20px; }
        #wanted-list { display: grid; gap: 16px; width: 100%; }
        
        /* 🔲 各自の環境で並びを変えられる設定 */
        #wanted-list[data-size="mobile"] { grid-template-columns: 1fr; max-width: 400px; margin: 0 auto; } 
        #wanted-list[data-size="small"] { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
        #wanted-list[data-size="medium"] { grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); }
        #wanted-list[data-size="large"] { grid-template-columns: 1fr; }
        
        .wanted-card { background: #171d26; border: 1px solid #252d3d; border-radius: 8px; padding: 16px; box-sizing: border-box; transition: all 0.3s ease; position: relative; }
        .wanted-badge { display: inline-block; padding: 4px 8px; background: #ff3333; color: #fff; font-weight: bold; font-size: 11px; border-radius: 4px; margin-bottom: 12px; }
        .limit-time { font-size: 14px; color: #ffcc00; font-weight: bold; margin-bottom: 12px; }
        .section-title { color: #8a99ad; font-size: 12px; font-weight: bold; margin-bottom: 6px; margin-top: 14px; border-left: 3px solid #3b485e; padding-left: 6px; }
        
        /* 👤 容疑者名ごとの行スタイル */
        .suspect-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; border-bottom: 1px solid #222a36; }
        .suspect-name { font-weight: bold; font-size: 16px; color: #fff; white-space: pre-wrap; }
        .逮捕ボタン { background: #252d3d; color: #ff4d4d; border: 1px solid #ff4d4d; border-radius: 4px; padding: 2px 6px; font-size: 11px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .逮捕ボタン:hover { background: #ff4d4d; color: #fff; }
        
        /* 🔄 復活ボタンのスタイル */
        .reset-link { position: absolute; top: 16px; right: 16px; font-size: 11px; color: #a3b3cc; background: none; border: none; cursor: pointer; text-decoration: underline; padding: 0; font-weight: bold; }
        .reset-link:hover { color: #ffcc00; }

        .toggle-btn { display: flex; justify-content: space-between; width: 100%; padding: 8px 12px; background: #252d3d; border: none; color: #a3b3cc; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; margin-top: 6px; }
        .toggle-content { display: none; margin-top: 8px; padding: 12px; background: #11141a; border-radius: 4px; white-space: pre-wrap; color: #ffcc00; font-size: 14px; line-height: 1.5; font-weight: bold; }
        
        /* 👑 特殊指名手配（無期限）用の特別紫デザイン */
        .wanted-card.special-mode { border: 2px solid #b300ff !important; background: linear-gradient(135deg, #1b1124 0%, #11091a 100%) !important; box-shadow: 0 0 15px rgba(179, 0, 255, 0.2); }
        .wanted-card.special-mode .wanted-badge { background: linear-gradient(90deg, #b300ff 0%, #d4af37 100%) !important; }

        /* 🚨 残り30分未満の警告カードデザイン */
        .wanted-card.alert-mode { border: 2px solid #ff9900 !important; box-shadow: 0 0 15px rgba(255, 153, 0, 0.4); animation: pulseAlert 2.5s infinite; }
        .wanted-card.alert-mode .wanted-badge { background: #ff9900 !important; color: #11141a !important; }
        .wanted-card.alert-mode .limit-time { color: #ff9900 !important; }
        @keyframes pulseAlert {
            0% { box-shadow: 0 0 15px rgba(255, 153, 0, 0.3); }
            50% { box-shadow: 0 0 4px rgba(255, 153, 0, 0.1); }
            100% { box-shadow: 0 0 15px rgba(255, 153, 0, 0.3); }
        }

        /* 💡 「名前のみ表示」ルール */
        #wanted-list.name-only-mode .limit-time,
        #wanted-list.name-only-mode .wanted-badge,
        #wanted-list.name-only-mode .section-title,
        #wanted-list.name-only-mode .toggle-btn,
        #wanted-list.name-only-mode .toggle-content { display: none !important; }
        #wanted-list.name-only-mode .wanted-card { padding: 12px; padding-top: 35px; } 
        #wanted-list.name-only-mode .suspect-row { border-bottom: none; padding: 2px 0; }
    </style>
</head>
<body>

    <!-- コントロールパネル -->
    <div style="margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 15px; align-items: center; background: #171d26; padding: 12px; border-radius: 6px; border: 1px solid #252d3d;">
        <div style="display: flex; gap: 6px; align-items: center;">
            <span style="font-size: 13px; color: #a3b3cc; font-weight: bold;">🔲 サイズ:</span>
            <button onclick="changeSize('mobile')" id="btn-mobile" style="padding: 6px 10px; background: #252d3d; color: #fff; border: 1px solid #3b485e; cursor: pointer; border-radius: 4px; font-size: 12px;">📱スマホ</button>
            <button onclick="changeSize('small')" id="btn-small" style="padding: 6px 10px; background: #252d3d; color: #fff; border: 1px solid #3b485e; cursor: pointer; border-radius: 4px; font-size: 12px;">小</button>
            <button onclick="changeSize('medium')" id="btn-medium" style="padding: 6px 10px; background: #252d3d; color: #fff; border: 1px solid #3b485e; cursor: pointer; border-radius: 4px; font-size: 12px;">中</button>
            <button onclick="changeSize('large')" id="btn-large" style="padding: 6px 10px; background: #252d3d; color: #fff; border: 1px solid #3b485e; cursor: pointer; border-radius: 4px; font-size: 12px;">大</button>
        </div>

        <div style="display: flex; gap: 6px; align-items: center; border-left: 1px solid #3b485e; padding-left: 15px;">
            <span style="font-size: 13px; color: #a3b3cc; font-weight: bold;">👁️ 表示モード:</span>
            <button onclick="toggleDisplayMode()" id="btn-mode-toggle" style="padding: 6px 12px; background: #252d3d; color: #fff; border: 1px solid #3b485e; cursor: pointer; border-radius: 4px; font-size: 12px; font-weight: bold;">通常表示</button>
        </div>

        <!--  非表示カードを一括ですべて元に戻すコントロールボタン -->
        <div id="global-reset-area" style="display: none; gap: 6px; align-items: center; border-left: 1px solid #3b485e; padding-left: 15px;">
            <button onclick="resetAllHiddenSuspects()" style="padding: 6px 12px; background: #ff4d4d; color: #fff; border: none; cursor: pointer; border-radius: 4px; font-size: 12px; font-weight: bold;">🔄 非表示中をすべて元に戻す</button>
        </div>
    </div>

    <div id="wanted-list" data-size="medium"></div>

    <script>
        //  ここにGoogleスプレッドシートのCSV URLを貼り付け
        const SPREADSHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQD3U8h3RprT9JzloMcWAL04QFXRVYH470r00GnBAYkcRiQ33Qha9tws1ozjEHSm1WYPXC2oLxPzYFy/pub?gid=1025771059&single=true&output=csv";

        let currentSize = localStorage.getItem('wanted-card-size') || 'medium';
        let isNameOnly = localStorage.getItem('wanted-name-only') === 'true';
        let hiddenSuspects = JSON.parse(localStorage.getItem('hidden-suspects') || '[]');

        function changeSize(size) {
            currentSize = size;
            localStorage.setItem('wanted-card-size', size);
            document.getElementById('wanted-list').setAttribute('data-size', size);
            updateButtonStyles();
        }

        function toggleDisplayMode() {
            isNameOnly = !isNameOnly;
            localStorage.setItem('wanted-name-only', isNameOnly);
            updateButtonStyles();
        }

        function updateButtonStyles() {
            const sizes = ['mobile', 'small', 'medium', 'large'];
            sizes.forEach(s => {
                const btn = document.getElementById('btn-' + s);
                if (btn) {
                    if (s === currentSize) {
                        btn.style.background = "#ffcc00"; btn.style.color = "#11141a"; btn.style.fontWeight = "bold";
                    } else {
                        btn.style.background = "#252d3d"; btn.style.color = "#fff"; btn.style.fontWeight = "normal";
                    }
                }
            });

            const container = document.getElementById('wanted-list');
            const toggleBtn = document.getElementById('btn-mode-toggle');
            if (container && toggleBtn) {
                if (isNameOnly) {
                    container.classList.add('name-only-mode');
                    toggleBtn.textContent = "👤 名前のみ";
                    toggleBtn.style.background = "#ffcc00"; toggleBtn.style.color = "#11141a";
                } else {
                    container.classList.remove('name-only-mode');
                    toggleBtn.textContent = "📋 通常表示";
                    toggleBtn.style.background = "#252d3d"; toggleBtn.style.color = "#fff";
                }
            }

            const globalResetArea = document.getElementById('global-reset-area');
            if (globalResetArea) {
                globalResetArea.style.display = hiddenSuspects.length > 0 ? "flex" : "none";
            }
        }

        function robustParseCSV(text) {
            let lines = [], row = [], currentCell = '', inQuotes = false;
            if (!text) return lines;
            for (let i = 0; i < text.length; i++) {
                let char = text[i], nextChar = text[i + 1];
                if (char === '"') {
                    if (inQuotes && nextChar === '"') { currentCell += '"'; i++; } else { inQuotes = !inQuotes; }
                } else if (char === ',' && !inQuotes) { row.push(currentCell); currentCell = ''; }
                else if ((char === '\r' || char === '\n') && !inQuotes) {
                    if (char === '\r' && nextChar === '\n') i++;
                    row.push(currentCell); lines.push(row); row = []; currentCell = '';
                } else { currentCell += char; }
            }
            if (currentCell || row.length > 0) { row.push(currentCell); lines.push(row); }
            return lines;
        }

        function parseLimitDateObj(text) {
            if (!text || text.includes('無期限')) return null;
            const timeMatch = text.match(/(\d{1,2})\/(\d{1,2})\s+(\d{1,2}):(\d{1,2})/);
            if (!timeMatch) return null;
            
            const month = parseInt(timeMatch[1], 10);
            const day = parseInt(timeMatch[2], 10);
            const hour = parseInt(timeMatch[3], 10);
            const minute = parseInt(timeMatch[4], 10);
            
            return new Date(2026, month - 1, day, hour, minute);
        }

        function hideSingleSuspect(uniqueKey, originalLine, cardId) {
            if (!hiddenSuspects.includes(uniqueKey)) {
                hiddenSuspects.push(uniqueKey);
                localStorage.setItem('hidden-suspects', JSON.stringify(hiddenSuspects));
                fetchList();
                updateButtonStyles();
            }
        }

        function resetCardSuspects(cardId) {
            hiddenSuspects = hiddenSuspects.filter(key => !key.startsWith(cardId + "-"));
            localStorage.setItem('hidden-suspects', JSON.stringify(hiddenSuspects));
            fetchList();
            updateButtonStyles();
        }

        function resetAllHiddenSuspects() {
            hiddenSuspects = [];
            localStorage.removeItem('hidden-suspects');
            fetchList();
            updateButtonStyles();
        }


        async function fetchList() {
            try {
                const response = await fetch(SPREADSHEET_CSV_URL + (SPREADSHEET_CSV_URL.includes('?') ? '&' : '?') + "nocache=" + Date.now());
                const csvText = await response.text();
                const allRows = robustParseCSV(csvText);
                const container = document.getElementById('wanted-list');
                
                container.setAttribute('data-size', currentSize);
                container.innerHTML = '';

                let latestCardsMap = {}; 
                const now = new Date();

                for (let i = 1; i < allRows.length; i++) {
                    const currentRow = allRows[i];
                    if (!currentRow || currentRow.length < 2) continue;

                    const targetText = currentRow; 
                    const targetStatus = currentRow ? currentRow.trim().toUpperCase() : ""; 

                    if (!targetText || !targetText.trim()) continue;

                    const lines = targetText.split(/[\r\n]+/);
                    let suspects = [], crimes = [], isCrimeSection = false;

                    lines.forEach(line => {
                        let trimmed = line.trim();
                        if (!trimmed) return;
                        if (trimmed === '指名手配' || trimmed.includes('特殊指名手配') || trimmed.includes('無期限') || trimmed.includes('まで') || trimmed.includes('🕐️') || trimmed.includes('📢')) return;

                        if (trimmed.includes('罪状')) {
                            isCrimeSection = true;
                            return;
                        }

                        if (trimmed.startsWith('・')) {
                            if (isCrimeSection) { crimes.push(trimmed); } else { suspects.push(trimmed); }
                        } else {
                            if (isCrimeSection) { crimes.push("・" + trimmed); } else { suspects.push("・" + trimmed); }
                        }
                    });

                    if (suspects.length === 0) suspects.push("・記載なし");
                    let suspectPart = suspects.join('\n'), crimePart = crimes.join('\n');

                    const nameKey = suspectPart.replace(/・/g, '').replace(/\s+/g, '');
                    if (!nameKey) continue;

                    if (targetStatus === "TRUE" || targetStatus.includes("逮捕済み")) {
                        if (latestCardsMap[nameKey]) delete latestCardsMap[nameKey];
                        continue;
                    }

                    const isSpecial = targetText.includes('特殊指名手配') || targetText.includes('無期限');
                    const limitDate = parseLimitDateObj(targetText);

                    if (!isSpecial && limitDate && limitDate <= now) continue;

                    let limitTimeStr = "不明";
                    if (isSpecial) {
                        limitTimeStr = "無期限 🕐️";
                    } else {
                        const timeMatch = targetText.match(/(\d{1,2}\/\d{1,2}\s+\d{1,2}:\d{1,2})/);
                        if (timeMatch) limitTimeStr = timeMatch + " まで";
                    }

                    let isUnder30Min = false;
                    if (!isSpecial && limitDate) {
                        const diffMs = limitDate.getTime() - now.getTime();
                        if (diffMs > 0 && diffMs < 30 * 60 * 1000) isUnder30Min = true;
                    }

                    if (!isSpecial && isUnder30Min) {
                        limitTimeStr += " 🚨（残り30分未満！）";
                    }

                    const sortTime = isSpecial ? 0 : (limitDate ? limitDate.getTime() : 8640000000000000);
                    
                    latestCardsMap[nameKey] = {
                        id: i, sortTime: sortTime, isSpecial: isSpecial, isUnder30Min: isUnder30Min,
                        limitTimeStr: limitTimeStr, suspectList: suspects, crimePart: crimePart
                    };
                }

                let validCards = Object.values(latestCardsMap);
                validCards.sort((a, b) => a.sortTime - b.sortTime);

                validCards.forEach(data => {
                    let visibleSuspectRowsHtml = '';
                    let hiddenCount = 0;

                    data.suspectList.forEach((suspect) => {
                        const uniqueKey = data.id + "-" + suspect.replace(/\s+/g, '');
                        if (hiddenSuspects.includes(uniqueKey)) {
                            hiddenCount++;
                        } else {
                            visibleSuspectRowsHtml += `
                                <div class="suspect-row">
                                    <span class="suspect-name">${suspect}</span>
                                    <button class="逮捕ボタン" onclick="hideSingleSuspect('${uniqueKey}', '${suspect}', ${data.id})">済</button>
                                </div>
                            `;
                        }
                    });

                    //  カード内の犯人が全員「済」になったら、カード自体を完全にスキップ（非表示にする）
                    if (hiddenCount > 0 && hiddenCount === data.suspectList.length) {
                        return; 
                    }

                    const cardElement = document.createElement('div');
                    if (data.isSpecial) { cardElement.className = "wanted-card special-mode"; }
                    else if (data.isUnder30Min) { cardElement.className = "wanted-card alert-mode"; }
                    else { cardElement.className = "wanted-card"; }

                    const badgeName = data.isSpecial ? '特殊指名手配' : (data.isUnder30Min ? '🚨 URGENT' : 'WANTED');
                    const resetBtnHtml = hiddenCount > 0 ? `<button class="reset-link" onclick="resetCardSuspects(${data.id})">🔄 ${hiddenCount}名非表示中 [元に戻す]</button>` : '';

                    cardElement.innerHTML = `
                        <div class="wanted-badge">${badgeName}</div>
                        ${resetBtnHtml}
                        <div class="limit-time">⏱️ 期限: ${data.limitTimeStr}</div>
                        <div class="section-title">👤 犯人</div>
                        <div style="display: flex; flex-direction: column; gap: 4px;">${visibleSuspectRowsHtml}</div>
                        <div class="section-title">⚖️ 詳細</div>
                        <button class="toggle-btn" onclick="toggleSection(${data.id}, this)">
                            <span>詳細を確認 (隠されています)</span> <span>▼</span>
                        </button>
                        <div id="crime-${data.id}" class="toggle-content">${data.crimePart || '・記載なし'}</div>
                    `;
                    container.appendChild(cardElement);
                });

                if (container.innerHTML === '') {
                    container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #8a99ad; padding: 40px; font-size: 15px;">現在、有効な指名手配はありません。</div>';
                }
            } catch (error) {
                document.getElementById('wanted-list').innerText = 'データの処理中にエラーが発生しました。';
            }
        }

        function toggleSection(id, btn) {
            const content = document.getElementById('crime-' + id);
            if (content.style.display === "block") {
                content.style.display = "none";
                btn.style.background = "#252d3d"; btn.style.color = "#a3b3cc";
                btn.innerHTML = "<span>詳細を確認 (隠されています)</span> <span>▼</span>";
            } else {
                content.style.display = "block";
                btn.style.background = "#ffcc00"; btn.style.color = "#11141a";
                btn.innerHTML = "<span>詳細を隠す</span> <span>▲</span>";
            }
        }

        updateButtonStyles();
        fetchList();
        setInterval(fetchList, 180000);
    </script>
</body>
</html>
