<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>指名手配リスト</title>
    <style>
        body { background: #11141a; color: #fff; font-family: sans-serif; padding: 20px; }
        
        /* 🔲 サイズ変更用の設定（大：1列、中：2列、小：3列） */
        #wanted-list { display: grid; gap: 16px; width: 100%; }
        #wanted-list[data-size="small"] { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
        #wanted-list[data-size="medium"] { grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); }
        #wanted-list[data-size="large"] { grid-template-columns: 1fr; }

        /* 通常カードのデザイン */
        .wanted-card { background: #171d26; border: 1px solid #252d3d; border-radius: 8px; padding: 16px; box-sizing: border-box; }
        .wanted-badge { display: inline-block; padding: 4px 8px; background: #ff3333; color: #fff; font-weight: bold; font-size: 11px; border-radius: 4px; margin-bottom: 10px; }
        .text-area { white-space: pre-wrap; font-weight: bold; font-size: 15px; line-height: 1.6; color: #fff; }

        /* 👑 特殊指名手配（無期限）用の紫＆ゴールドデザイン */
        .wanted-card.special-mode { border: 2px solid #b300ff !important; background: linear-gradient(135deg, #1b1124 0%, #11091a 100%) !important; box-shadow: 0 0 15px rgba(179, 0, 255, 0.2); }
        .wanted-card.special-mode .wanted-badge { background: linear-gradient(90deg, #b300ff 0%, #d4af37 100%) !important; color: #fff !important; }
    </style>
</head>
<body>

    <!-- 🔲 サイズ変更ボタン -->
    <div style="margin-bottom: 15px; display: flex; gap: 8px; align-items: center;">
        <span style="font-size: 14px; color: #a3b3cc; font-weight: bold;">🔲 カードの大きさ:</span>
        <button onclick="changeSize('small')" style="padding: 6px 12px; background: #252d3d; color: #fff; border: 1px solid #3b485e; cursor: pointer; border-radius: 4px;">小（複数列）</button>
        <button onclick="changeSize('medium')" style="padding: 6px 12px; background: #252d3d; color: #fff; border: 1px solid #3b485e; cursor: pointer; border-radius: 4px;">中</button>
        <button onclick="changeSize('large')" style="padding: 6px 12px; background: #252d3d; color: #fff; border: 1px solid #3b485e; cursor: pointer; border-radius: 4px;">大（1列表示）</button>
    </div>

    <!-- カードが並ぶ場所 -->
    <div id="wanted-list" data-size="medium"></div>

    <script>
        // ⚠️ ここにご自身のGoogleスプレッドシートのCSV URLを確実に貼り付けてください
        const SPREADSHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQD3U8h3RprT9JzloMcWAL04QFXRVYH470r00GnBAYkcRiQ33Qha9tws1ozjEHSm1WYPXC2oLxPzYFy/pub?gid=1025771059&single=true&output=csv";

        // 各自のブラウザ環境でサイズを切り替える関数
        function changeSize(size) {
            document.getElementById('wanted-list').setAttribute('data-size', size);
        }

        // 最も壊れにくいシンプルなCSVパース（解析）処理
        function parseSpreadsheetCSV(text) {
            let lines = text.split('\n');
            let result = [];
            for (let i = 0; i < lines.length; i++) {
                let line = lines[i];
                if (!line) continue;
                let cells = [];
                let currentCell = '';
                let insideQuotes = false;
                for (let j = 0; j < line.length; j++) {
                    let char = line[j];
                    if (char === '"') {
                        insideQuotes = !insideQuotes;
                    } else if (char === ',' && !insideQuotes) {
                        cells.push(currentCell);
                        currentCell = '';
                    } else {
                        currentCell += char;
                    }
                }
                cells.push(currentCell);
                result.push(cells);
            }
            return result;
        }

        // リストを取得して画面にカードを作るメイン機能
        async function fetchList() {
            try {
                const response = await fetch(SPREADSHEET_CSV_URL + (SPREADSHEET_CSV_URL.includes('?') ? '&' : '?') + "nocache=" + Date.now());
                const csvText = await response.text();
                const allRows = parseSpreadsheetCSV(csvText);
                
                const container = document.getElementById('wanted-list');
                container.innerHTML = '';

                // 2行目（インデックス1）から順番に1行ずつチェック
                for (let i = 1; i < allRows.length; i++) {
                    const currentRow = allRows[i];
                    
                    // A列（タイムスタンプ）とB列（本文）が無ければ飛ばす
                    if (!currentRow || currentRow.length < 2) continue;

                    // 💡 列データを変数へ確実に固定取得（0=A列, 1=B列, 2=C列）
                    const targetText = currentRow[1]; 
                    const targetStatus = currentRow[2] ? currentRow[2].trim().toUpperCase() : ""; 

                    // 💡 【逮捕済みの自動削除】C列にチェック（TRUE）が入っていれば画面に表示しない
                    if (targetStatus === "TRUE" || targetStatus.includes("逮捕済み")) {
                        continue;
                    }
                    if (!targetText || !targetText.trim()) {
                        continue;
                    }

                    // 💡 「特殊指名手配」または「無期限」の文字列が含まれているかチェック
                    const isSpecialHandan = targetText.includes('特殊指名手配') || targetText.includes('無期限');

                    // 🗂️ 手配書カードの見た目を組み立てる
                    const cardElement = document.createElement('div');
                    cardElement.className = "wanted-card";
                    if (isSpecialHandan === true) {
                        cardElement.className = "wanted-card special-mode";
                    }

                    const badgeName = (isSpecialHandan === true) ? '特殊指名手配' : 'WANTED';

                    cardElement.innerHTML = `
                        <div class="wanted-badge">${badgeName}</div>
                        <div class="text-area">${targetText}</div>
                    `;
                    container.appendChild(cardElement);
                }

                // もし有効なカードが1枚も残らなかった場合
                if (container.innerHTML === '') {
                    container.innerHTML = '<div style="text-align: center; color: #8a99ad; padding: 40px; font-size: 15px;">現在、有効な指名手配はありません。</div>';
                }
            } catch (error) {
                document.getElementById('wanted-list').innerText = 'データの読み込み、または処理中にエラーが発生しました。';
            }
        }

        // ページを開いた瞬間に1回実行
        fetchList();
        // 以降、3分（180000ミリ秒）ごとに自動的に最新状態へ更新
        setInterval(fetchList, 180000);
    </script>
</body>
</html>
